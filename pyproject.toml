[project]
name = "so101-bridge"
version = "3.3.0"
description = "Safety-enforcing control bridge for the SO-101 follower arm: daemon, dashboard, agent interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lerobot",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
]

[project.scripts]
so101-bridge = "so101_bridge.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_bridge"]

[tool.uv.sources]
lerobot = { path = "../lerobot", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
# The daemon is deliberately written in a dense, one-statement-per-guard style; only real defects
# (undefined names, unused imports, bad syntax) and import order are enforced.
select = ["F", "E4", "E9", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
