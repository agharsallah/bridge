[project]
name = "so101-bridge"
version = "3.3.0"
description = "SO-101 follower control bridge: safety daemon, dashboard, and agent command interface."
requires-python = ">=3.12"
dependencies = [
    "lerobot",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python-headless>=4.9.0,<4.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
lerobot = { path = "../lerobot", editable = true }
